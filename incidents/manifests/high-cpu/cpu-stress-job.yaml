apiVersion: batch/v1
kind: Job
metadata:
  name: cpu-stress
  namespace: observability
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
      - name: cpu-stress
        image: polinux/stress
        command:
        - stress
        args:
        - "--cpu"
        - "1"
        - "--timeout"
        - "600"
